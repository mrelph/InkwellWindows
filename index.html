<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- color-scheme is owned by styles.css and follows the active theme's mode;
         hardcoding it here would pin the app to light. -->
    <!-- No remote content: images load only through the inkwell-asset scheme.
         The policy itself is written by the inkwell-csp plugin in
         vite.config.ts: strict in the production build, plus the HMR socket
         and inline styles only under the dev server. -->
    <meta http-equiv="Content-Security-Policy" content="%INKWELL_CSP%" />
    <title>Inkwell</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/bootstrap.tsx"></script>
  </body>
</html>
